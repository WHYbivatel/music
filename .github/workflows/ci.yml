name: Test and build every revision
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # No .next cache: CSS-only changes also receive a fresh release ID and worker.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: neon-sound-build-check-${{ github.sha }}
          include-hidden-files: true
          retention-days: 7
          path: |
            .release/build.json
            .next/BUILD_ID
            .next/static
            public/sw.js
